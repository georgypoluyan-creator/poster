<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
  <title>Приложение к постеру</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #E8E3D9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      justify-content: center;
      min-height: 100vh;
    }
    .app-container {
      width: 100%;
      max-width: 480px;
      position: relative;
      background-color: #F4EFE6;
      box-shadow: 0 0 25px rgba(0, 0, 0, 0.12);
    }
    .slide {
      display: none;
      width: 100%;
      position: relative;
      animation: fadeSlide 0.3s ease forwards;
    }
    .slide.active {
      display: block;
    }
    @keyframes fadeSlide {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .slide img {
      width: 100%;
      height: auto;
      display: block;
    }
    /* Кликабельная зона поверх таблички на 1-м слайде */
    .sign-hotspot {
      position: absolute;
      left: 8%;
      bottom: 6%;
      width: 68%;
      height: 44%;
      background: transparent;
      border: none;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    /* Кнопка возврата на 2-м слайде */
    .back-bar {
      padding: 16px;
      background-color: #F4EFE6;
      border-top: 2px solid #000000;
    }
    .back-btn {
      width: 100%;
      padding: 14px;
      background-color: #E32636;
      color: #FFFFFF;
      font-size: 16px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      border: 2px solid #000000;
      box-shadow: 4px 4px 0px #000000;
      cursor: pointer;
      transition: transform 0.1s, box-shadow 0.1s;
    }
    .back-btn:active {
      transform: translate(4px, 4px);
      box-shadow: 0px 0px 0px #000000;
    }
  </style>
</head>
<body>
 
  <div class="app-container">
    <!-- Слайд 1: Стартовый экран -->
    <div id="slide1" class="slide active">
      <img src="screen1.png" alt="Добро пожаловать в приложение к постеру">
      <button class="sign-hotspot" onclick="goToSlide('slide2')" aria-label="Узнать про неспецифические взаимодействия"></button>
    </div>
 
    <!-- Слайд 2: Неспецифические взаимодействия -->
    <div id="slide2" class="slide">
      <img src="screen2.png" alt="Неспецифические взаимодействия с сорбентом">
      <div class="back-bar">
        <button class="back-btn" onclick="goToSlide('slide1')">← Назад на главную</button>
      </div>
    </div>
  </div>
 
  <script>
    function goToSlide(slideId) {
      document.querySelectorAll('.slide').forEach(el => el.classList.remove('active'));
      document.getElementById(slideId).classList.add('active');
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }
  </script>
 
</body>
</html>
