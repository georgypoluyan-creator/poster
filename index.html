<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Brutalist App</title>
    <style>
        :root {
            --bg-color: #F4EFE6;
            --accent-color: #E32636;
            --black: #000000;
            --white: #FFFFFF;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            font-family: 'Arial Black', 'Helvetica Neue', Helvetica, sans-serif;
            color: var(--black);
            overflow-x: hidden;
            user-select: none;
        }

        /* Screen Management */
        .screen {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 24px;
            width: 100vw;
        }

        .screen.active {
            display: flex;
            animation: slideFadeIn 0.4s cubic-bezier(0.25, 1, 0.5, 1) forwards;
        }

        /* Typography */
        h1 {
            font-size: 28px;
            font-weight: 900;
            text-transform: uppercase;
            text-align: center;
            line-height: 1.2;
            margin-bottom: 40px;
            letter-spacing: -0.5px;
        }

        h2 {
            font-size: 22px;
            font-weight: 900;
            text-transform: uppercase;
            text-align: center;
            line-height: 1.2;
            margin-bottom: 24px;
            letter-spacing: -0.5px;
        }

        /* UI Elements - Buttons */
        .btn {
            display: block;
            width: 100%;
            max-width: 400px;
            background-color: var(--accent-color);
            color: var(--white);
            font-family: inherit;
            font-size: 16px;
            font-weight: 900;
            text-transform: uppercase;
            text-align: center;
            padding: 18px 20px;
            margin-bottom: 20px;
            border: 2px solid var(--black);
            border-radius: 0; /* Sharp square corners */
            box-shadow: 4px 4px 0px var(--black);
            cursor: pointer;
            transition: transform 0.1s ease, box-shadow 0.1s ease;
            line-height: 1.3;
        }

        .btn.secondary {
            background-color: var(--white);
            color: var(--black);
            margin-top: auto;
        }

        /* Active / Press State */
        .btn:active {
            transform: translate(4px, 4px);
            box-shadow: 0px 0px 0px var(--black);
        }

        /* Animation Placeholder */
        .animation-container {
            width: 100%;
            max-width: 400px;
            height: 250px;
            background-color: var(--white);
            border: 2px solid var(--black);
            box-shadow: 4px 4px 0px var(--black);
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 40px;
            font-size: 14px;
            font-weight: 900;
            text-transform: uppercase;
            color: var(--black);
            text-align: center;
            padding: 20px;
        }

        /* Screen Transition Animation */
        @keyframes slideFadeIn {
            0% {
                opacity: 0;
                transform: translateY(15px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Container specific adjustments for Screen 2 menu list */
        .menu-container {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            flex-grow: 1;
            justify-content: center;
        }
        
        .bottom-nav {
            width: 100%;
            max-width: 400px;
            margin-top: 40px;
        }
    </style>
</head>
<body>

    <!-- SCREEN 1: Start Screen -->
    <div id="screen-1" class="screen active">
        <h1>ДОБРО ПОЖАЛОВАТЬ В ПРИЛОЖЕНИЕ К МОЕМУ ПОСТЕРУ</h1>
        <button class="btn" onclick="navigateTo('screen-2')">УЗНАТЬ БОЛЬШЕ</button>
    </div>

    <!-- SCREEN 2: Poster Menu -->
    <div id="screen-2" class="screen">
        <div class="menu-container">
            <button class="btn" onclick="navigateTo('screen-3')">УЗНАТЬ ПРО РОДСТВЕННЫЕ ПРИМЕСИ</button>
            <button class="btn" onclick="navigateTo('screen-4')">УЗНАТЬ ПРО НЕСПЕЦИФИЧЕСКИЕ ВЗАИМОДЕЙСТВИЯ С СОРБЕНТОМ</button>
            <button class="btn" onclick="navigateTo('screen-5')">УЗНАТЬ КАК МОЛЕКУЛЫ БЕЛКА ДВИЖУТСЯ ПО КОЛОНКЕ</button>
        </div>
        <div class="bottom-nav">
            <button class="btn secondary" onclick="navigateTo('screen-1')">НАЗАД</button>
        </div>
    </div>

    <!-- SCREEN 3: Content Screen 1 -->
    <div id="screen-3" class="screen">
        <h2>УЗНАТЬ ПРО РОДСТВЕННЫЕ ПРИМЕСИ</h2>
        <div class="animation-container">
            Здесь будет анимация
        </div>
        <div class="bottom-nav">
            <button class="btn secondary" onclick="navigateTo('screen-2')">НАЗАД</button>
        </div>
    </div>

    <!-- SCREEN 4: Content Screen 2 -->
    <div id="screen-4" class="screen">
        <h2>УЗНАТЬ ПРО НЕСПЕЦИФИЧЕСКИЕ ВЗАИМОДЕЙСТВИЯ С СОРБЕНТОМ</h2>
        <div class="animation-container">
            Здесь будет анимация
        </div>
        <div class="bottom-nav">
            <button class="btn secondary" onclick="navigateTo('screen-2')">НАЗАД</button>
        </div>
    </div>

    <!-- SCREEN 5: Content Screen 3 -->
    <div id="screen-5" class="screen">
        <h2>УЗНАТЬ КАК МОЛЕКУЛЫ БЕЛКА ДВИЖУТСЯ ПО КОЛОНКЕ</h2>
        <div class="animation-container">
            Здесь будет анимация
        </div>
        <div class="bottom-nav">
            <button class="btn secondary" onclick="navigateTo('screen-2')">НАЗАД</button>
        </div>
    </div>

    <!-- SPA Logic -->
    <script>
        function navigateTo(targetScreenId) {
            // Remove 'active' class from all screens
            const screens = document.querySelectorAll('.screen');
            screens.forEach(screen => {
                screen.classList.remove('active');
            });

            // Trigger reflow to restart CSS animation (hack for smooth re-trigger)
            void document.body.offsetWidth;

            // Add 'active' class to the target screen
            const targetScreen = document.getElementById(targetScreenId);
            if (targetScreen) {
                targetScreen.classList.add('active');
                window.scrollTo(0, 0);
            }
        }
    </script>
</body>
</html>
